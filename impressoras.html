<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>TI Hub | Impressoras instaladas</title>
		<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com" rel="preconnect" />
		<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<link href="style.css" rel="stylesheet" />
	</head>
	<body data-page="impressoras">
		<div class="app-shell">
			<!-- ===================== BARRA LATERAL (MENU PRINCIPAL) =====================
       Substitui o antigo menu horizontal (.hub-nav). Mesmos links de sempre,
       em formato de coluna, com a página atual destacada em verde. -->
			<aside class="sidebar">
				<div class="sidebar-brand">
					<div class="brand-chip"><i class="ti ti-server"></i></div>
					<div>
						<h1>TI Hub</h1>
						<div class="sub">Gestão do setor</div>
					</div>
				</div>

				<nav class="sidebar-nav" aria-label="Módulos do TI Hub">
					<a class="nav-link" href="index.html"><i class="ti ti-layout-dashboard"></i> Visão geral</a>
					<a class="nav-link" href="senhas.html"><i class="ti ti-key"></i> Lista de senhas</a>
					<a class="nav-link" href="notebooks.html"><i class="ti ti-device-laptop"></i> Notebooks</a>
					<a class="nav-link" href="estoque.html"><i class="ti ti-keyboard"></i> Estoque</a>
					<a class="nav-link" href="compras.html"><i class="ti ti-shopping-cart"></i> Lista de compras</a>
					<a class="nav-link active" href="impressoras.html"><i class="ti ti-printer"></i> Impressoras</a>
					<a class="nav-link" href="projetos.html"><i class="ti ti-brand-trello"></i> Projetos / Trello</a>
					<a class="nav-link" href="chamados.html"><i class="ti ti-lifebuoy"></i> Chamados</a>
					<a class="nav-link" href="orcamento.html"><i class="ti ti-wallet"></i> Orçamento</a>
					<a class="nav-link" href="tutoriais.html"><i class="ti ti-book-2"></i> Tutoriais internos</a>
				</nav>
			</aside>

			<!-- ===================== ÁREA PRINCIPAL DA PÁGINA ===================== -->
			<div class="main-area">
				<!-- Barra superior: trilha de navegação (breadcrumb) + ações rápidas -->
				<header class="topbar">
					<div class="breadcrumb">
						<a href="index.html">TI Hub</a>
						<i class="ti ti-chevron-right"></i>
						<span>Impressoras</span>
					</div>
				</header>

				<div class="wrap">
					<div style="justify-content: space-between; align-items: center; margin-bottom: 14px">
						<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px">
							<button class="primary add-button" id="togglePrinterForm" type="button"><i class="ti ti-plus"></i> Cadastrar impressora</button>
						</div>

						<form class="inline-form" id="formPrinter" hidden>
							<div class="form-grid">
								<div class="field">
									<label for="printerSetor">Setor</label>
									<input id="printerSetor" name="setor" type="text" required />
								</div>

								<div class="field">
									<label for="printerMarca">Marca</label>
									<input id="printerMarca" name="marca" type="text" required />
								</div>

								<div class="field">
									<label for="printerModelo">Modelo</label>
									<input id="printerModelo" name="modelo" type="text" required />
								</div>

								<div class="field">
									<label for="printerIp">IP</label>
									<input id="printerIp" name="ip" type="text" required />
								</div>

								<div class="field">
									<label for="printerSerial">Número de série</label>
									<input id="printerSerial" name="numeroSerie" type="text" required />
								</div>
							</div>

							<div class="form-actions">
								<button class="ghost hidden" id="cancelEditPrinter" type="button">Cancelar edição</button>

								<button class="primary" type="submit">Salvar impressora</button>
							</div>
						</form>
					</div>

					<div class="panel">
						<div class="table-wrap">
							<table>
								<thead>
									<tr>
										<th>Setor</th>
										<th>Marca</th>
										<th>Modelo</th>
										<th>IP</th>
										<th>Número de série</th>
										<th>Ações</th>
									</tr>
								</thead>
								<tbody id="printerRows"></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>
		<script src="app.js"></script>
	</body>
</html>
