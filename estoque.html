<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<title>TI Hub | Estoque</title>
		<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" rel="stylesheet" />
		<link href="https://fonts.googleapis.com" rel="preconnect" />
		<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<link href="style.css" rel="stylesheet" />
		<style>
			.inline-form {
				margin-top: 14px;
				padding-top: 14px;
				border-top: 1px solid var(--line);
			}
			.inline-form[hidden] {
				display: none;
			}
			.form-grid .full {
				grid-column: 1/-1;
			}
			.add-button {
				display: inline-flex;
				align-items: center;
				gap: 7px;
			}
			.status-button {
				border: 0;
				cursor: pointer;
			}
			.status-button:hover {
				filter: brightness(1.12);
			}
			.status-button:disabled {
				cursor: default;
			}
			.empty-row {
				text-align: center !important;
				color: var(--text-faint);
				padding: 28px 12px !important;
			}
			@media (max-width: 640px) {
				.form-grid {
					grid-template-columns: 1fr;
				}
				.form-grid .full {
					grid-column: auto;
				}
			}
		</style>
	</head>
	<body data-page="estoque">
		<div class="app-shell">
			<aside class="sidebar">
				<div class="sidebar-brand">
					<div class="brand-chip"><i class="ti ti-server"></i></div>
					<div>
						<h1>TI Hub</h1>
						<div class="sub">Gestão do setor</div>
					</div>
				</div>

				<!-- navegação lateral -->
				<nav class="sidebar-nav" aria-label="Módulos do TI Hub">
					<a class="nav-link" href="index.html"><i class="ti ti-layout-dashboard"></i> Visão geral</a>
					<a class="nav-link" href="senhas.html"><i class="ti ti-key"></i> Lista de senhas</a>
					<a class="nav-link" href="notebooks.html"><i class="ti ti-device-laptop"></i> Notebooks</a>
					<a class="nav-link" href="impressoras.html"><i class="ti ti-printer"></i> Impressoras</a>
					<a class="nav-link active" href="estoque.html"><i class="ti ti-keyboard"></i> Estoque</a>
					<a class="nav-link" href="compras.html"><i class="ti ti-shopping-cart"></i> Lista de compras</a>
					<a class="nav-link" href="orcamento.html"><i class="ti ti-wallet"></i> Orçamento</a>
					<a class="nav-link" href="projetos.html"><i class="ti ti-brand-trello"></i> Projetos / Trello</a>
					<a class="nav-link" href="chamados.html"><i class="ti ti-lifebuoy"></i> Chamados</a>
					<a class="nav-link" href="tutoriais.html"><i class="ti ti-book-2"></i> Tutoriais internos</a>
				</nav>
			</aside>

			<div class="main-area">
				<header class="topbar">
					<div class="breadcrumb"><a href="index.html">TI Hub</a><i class="ti ti-chevron-right"></i><span>Estoque</span></div>
				</header>

				<div class="mini-wrap">
					<div style="justify-content: space-between; align-items: center; margin-bottom: 14px">
						<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px">
							<button class="primary add-button" id="toggleEstoqueForm" type="button"><i class="ti ti-plus"></i> Adicionar item</button>
						</div>
						<form class="inline-form" id="formEstoque" hidden>
							<div style="display: flex; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: flex-end">
								<div class="field full"><label for="estoqueItem">Item/Nome do material</label><input id="estoqueItem" name="item" required /></div>
								<div class="field"><label for="estoqueQuantidade">Quantidade atual</label><input id="estoqueQuantidade" name="quantidade" type="number" min="0" step="1" required /></div>
								<div class="field"><label for="estoqueMinimo">Quantidade mínima</label><input id="estoqueMinimo" name="minimo" type="number" min="0" step="1" required /></div>
							</div>
							<div class="form-actions">
								<button class="ghost" id="cancelEstoque" type="button">Cancelar</button>
								<button class="primary" type="submit">Salvar material</button>
							</div>
						</form>
					</div>

					<div class="panel">
						<div class="table-wrap">
							<table>
								<thead>
									<tr>
										<th>Item</th>
										<th>Quantidade</th>
										<th>Status</th>
										<th></th>
										<th></th>
									</tr>
								</thead>
								<tbody id="EstoqueRows"></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="app.js"></script>
		<div class="toast" id="toast" role="status" aria-live="polite"></div>
	</body>
</html>
